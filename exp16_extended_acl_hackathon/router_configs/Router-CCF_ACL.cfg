! ==============================================================================
! EXPERIMENT 16: EXTENDED ACL - ROUTER-CCF (R1) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname Router-CCF

! CCF Student LAN Subnet (140.80.32.0/21)
interface GigabitEthernet0/0
 description CCF Student Subnet (140.80.32.0/21)
 ip address 140.80.32.1 255.255.248.0
 no shutdown
exit

! WAN Serial Link to Router-CSE
interface Serial0/0/0
 description WAN to Router-CSE
 ip address 10.0.0.1 255.255.255.252
 clock rate 64000
 no shutdown
exit

router ospf 1
 network 140.80.32.0 0.0.7.255 area 0
 network 10.0.0.0 0.0.0.3 area 0
exit

! Extended ACL 101: Block HTTP (80) & HTTPS (443) from CCF to Hackathon Server (140.80.128.7)
access-list 101 remark Block Hackathon website from CCF students
access-list 101 deny tcp 140.80.32.0 0.0.7.255 host 140.80.128.7 eq 80
access-list 101 deny tcp 140.80.32.0 0.0.7.255 host 140.80.128.7 eq 443
access-list 101 permit ip any any

! Apply Inbound on CCF Gateway Interface (Closest to Source)
interface GigabitEthernet0/0
 ip access-group 101 in
exit

end
copy running-config startup-config
