! ==============================================================================
! EXPERIMENT 16: EXTENDED ACL - ROUTER-CSE (R2) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname Router-CSE

interface Serial0/0/0
 description WAN from Router-CCF
 ip address 10.0.0.2 255.255.255.252
 no shutdown
exit

interface GigabitEthernet0/0
 description CSE Hackathon Server Farm (140.80.128.0/21)
 ip address 140.80.128.1 255.255.248.0
 no shutdown
exit

router ospf 1
 network 140.80.128.0 0.0.7.255 area 0
 network 10.0.0.0 0.0.0.3 area 0
exit

end
copy running-config startup-config
