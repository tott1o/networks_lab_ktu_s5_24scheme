! ==============================================================================
! EXPERIMENT 15: STANDARD ACL - ROUTER-C (R3) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname Router-C

interface Serial0/0/0
 description WAN from Router-B
 ip address 172.16.40.2 255.255.255.0
 no shutdown
exit

interface GigabitEthernet0/0
 description Student Labs Subnet 172.16.50.0 (Lab_B, Lab_C)
 ip address 172.16.50.1 255.255.255.0
 no shutdown
exit

router ospf 1
 network 172.16.40.0 0.0.0.255 area 0
 network 172.16.50.0 0.0.0.255 area 0
exit

end
copy running-config startup-config
