! ==============================================================================
! EXPERIMENT 15: STANDARD ACL - ROUTER-A (R1) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname Router-A

! Protected Server Subnet (Host_A)
interface GigabitEthernet0/0
 description Protected Subnet 172.16.10.0 (Host_A)
 ip address 172.16.10.1 255.255.255.0
 no shutdown
exit

! WAN Link to Router-B
interface Serial0/0/0
 description WAN to Router-B
 ip address 172.16.20.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

router ospf 1
 network 172.16.10.0 0.0.0.255 area 0
 network 172.16.20.0 0.0.0.255 area 0
exit

! Standard Access List 10: Permit ONLY Host_B (172.16.30.2)
access-list 10 remark Permit only Host_B to reach 172.16.10.0
access-list 10 permit host 172.16.30.2
access-list 10 deny any

! Apply ACL 10 Outbound on interface towards Host_A
interface GigabitEthernet0/0
 ip access-group 10 out
exit

end
copy running-config startup-config
