! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2621 (R1) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 / 2811 in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2621

! LAN Interface (GigabitEthernet0/0 on Cisco 1941/2911; use Fa0/0 if on 2811)
interface GigabitEthernet0/0
 description LAN Interface (Subnet 172.16.10.0/24)
 ip address 172.16.10.1 255.255.255.0
 no shutdown
exit

! Static Routes towards Router 2501A (Next Hop 172.16.10.2)
ip route 172.16.20.0 255.255.255.0 172.16.10.2
ip route 172.16.30.0 255.255.255.0 172.16.10.2
ip route 172.16.40.0 255.255.255.0 172.16.10.2
ip route 172.16.50.0 255.255.255.0 172.16.10.2

end
copy running-config startup-config
