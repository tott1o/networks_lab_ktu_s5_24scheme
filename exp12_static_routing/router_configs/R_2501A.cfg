! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2501A CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R_2501A

! Ethernet Interface to 2621
interface FastEthernet0/0
 description Link to Router 2621
 ip address 172.16.10.2 255.255.255.0
 no shutdown
exit

! Serial Interface to 2501B (DCE)
interface Serial0/0/0
 description WAN Link to Router 2501B
 ip address 172.16.20.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

! Static Routes towards 2501B (Next Hop 172.16.20.2)
ip route 172.16.30.0 255.255.255.0 172.16.20.2
ip route 172.16.40.0 255.255.255.0 172.16.20.2
ip route 172.16.50.0 255.255.255.0 172.16.20.2

end
copy running-config startup-config
