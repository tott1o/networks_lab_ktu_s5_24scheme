! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2501A (R2) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2501A

! Ethernet Interface connected to LAN 1 (Router 2621)
interface GigabitEthernet0/0
 description Link to LAN 1 (Router 2621)
 ip address 172.16.10.2 255.255.255.0
 no shutdown
exit

! Serial WAN Interface to Router 2501B (DCE) via HWIC-2T
interface Serial0/0/0
 description WAN Link to Router 2501B
 ip address 172.16.20.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

! Static Routes towards Router 2501B (Next Hop 172.16.20.2)
ip route 172.16.30.0 255.255.255.0 172.16.20.2
ip route 172.16.40.0 255.255.255.0 172.16.20.2
ip route 172.16.50.0 255.255.255.0 172.16.20.2

end
copy running-config startup-config
