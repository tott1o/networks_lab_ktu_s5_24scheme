! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2501C (R4) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2501C

! Serial WAN Interface towards Router 2501B (DTE)
interface Serial0/0/0
 description WAN Link from Router 2501B
 ip address 172.16.40.2 255.255.255.0
 no shutdown
exit

! Local LAN Interface (Subnet 50)
interface GigabitEthernet0/0
 description Local LAN 3 (Subnet 172.16.50.0/24)
 ip address 172.16.50.1 255.255.255.0
 no shutdown
exit

! Static Routes: All leftward traffic goes to Router 2501B (172.16.40.1)
ip route 172.16.10.0 255.255.255.0 172.16.40.1
ip route 172.16.20.0 255.255.255.0 172.16.40.1
ip route 172.16.30.0 255.255.255.0 172.16.40.1

end
copy running-config startup-config
