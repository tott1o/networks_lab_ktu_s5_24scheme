! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2501C CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R_2501C

! Serial Interface towards 2501B (DTE)
interface Serial0/0/0
 description WAN Link from Router 2501B
 ip address 172.16.40.2 255.255.255.0
 no shutdown
exit

! LAN Interface
interface FastEthernet0/0
 description Local LAN (Subnet 50)
 ip address 172.16.50.1 255.255.255.0
 no shutdown
exit

! Static Routes: All leftward traffic goes to 2501B (172.16.40.1)
ip route 172.16.10.0 255.255.255.0 172.16.40.1
ip route 172.16.20.0 255.255.255.0 172.16.40.1
ip route 172.16.30.0 255.255.255.0 172.16.40.1

end
copy running-config startup-config
