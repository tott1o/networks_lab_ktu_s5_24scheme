! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2501B (R3) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2501B

! Serial WAN Interface towards Router 2501A (DTE)
interface Serial0/0/0
 description WAN Link from Router 2501A
 ip address 172.16.20.2 255.255.255.0
 no shutdown
exit

! Local LAN Interface (Subnet 30)
interface GigabitEthernet0/0
 description Local LAN 2 (Subnet 172.16.30.0/24)
 ip address 172.16.30.1 255.255.255.0
 no shutdown
exit

! Serial WAN Interface towards Router 2501C (DCE)
interface Serial0/0/1
 description WAN Link to Router 2501C
 ip address 172.16.40.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

! Static Routes:
! 1) Leftward traffic goes to Router 2501A (172.16.20.1)
ip route 172.16.10.0 255.255.255.0 172.16.20.1

! 2) Rightward traffic goes to Router 2501C (172.16.40.2)
ip route 172.16.50.0 255.255.255.0 172.16.40.2

end
copy running-config startup-config
