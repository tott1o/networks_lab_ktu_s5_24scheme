! ==============================================================================
! EXPERIMENT 12: STATIC ROUTING - ROUTER 2501B CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R_2501B

! Serial Interface towards 2501A (DTE)
interface Serial0/0/0
 description WAN Link from Router 2501A
 ip address 172.16.20.2 255.255.255.0
 no shutdown
exit

! LAN Interface
interface FastEthernet0/0
 description Local LAN (Subnet 30)
 ip address 172.16.30.1 255.255.255.0
 no shutdown
exit

! Serial Interface towards 2501C (DCE)
interface Serial0/0/1
 description WAN Link to Router 2501C
 ip address 172.16.40.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

! Static Routes:
! 1) Leftward traffic goes to 2501A (172.16.20.1)
ip route 172.16.10.0 255.255.255.0 172.16.20.1

! 2) Rightward traffic goes to 2501C (172.16.40.2)
ip route 172.16.50.0 255.255.255.0 172.16.40.2

end
copy running-config startup-config
