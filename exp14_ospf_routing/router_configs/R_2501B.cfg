! ==============================================================================
! EXPERIMENT 14: OSPF ROUTING - ROUTER 2501B (R3) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2501B

interface Serial0/0/0
 description WAN Link from Router 2501A
 ip address 172.16.20.2 255.255.255.0
 no shutdown
exit

interface GigabitEthernet0/0
 description Local LAN 2 (Subnet 172.16.30.0/24)
 ip address 172.16.30.1 255.255.255.0
 no shutdown
exit

interface Serial0/0/1
 description WAN Link to Router 2501C
 ip address 172.16.40.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

router ospf 1
 router-id 3.3.3.3
 network 172.16.20.0 0.0.0.255 area 0
 network 172.16.30.0 0.0.0.255 area 0
 network 172.16.40.0 0.0.0.255 area 0
exit

end
copy running-config startup-config
