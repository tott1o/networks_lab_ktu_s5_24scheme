! ==============================================================================
! EXPERIMENT 14: OSPF ROUTING - ROUTER 2621 (R1) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2621

interface GigabitEthernet0/0
 description LAN Interface (Subnet 172.16.10.0/24)
 ip address 172.16.10.1 255.255.255.0
 no shutdown
exit

router ospf 1
 router-id 1.1.1.1
 network 172.16.10.0 0.0.0.255 area 0
exit

end
copy running-config startup-config
