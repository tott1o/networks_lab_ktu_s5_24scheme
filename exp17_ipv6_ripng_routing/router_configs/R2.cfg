! ==============================================================================
! EXPERIMENT 17: IPV6 RIPng - ROUTER R2 CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R2

ipv6 unicast-routing

ipv6 router rip CISCO_RIP
exit

interface Serial0/0/1
 description WAN from Router R1 (DTE)
 ipv6 address 2001:DB8:1111:4::2/64
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

interface GigabitEthernet0/0
 description LAN Subnet 2 (Host-B)
 ipv6 address 2001:DB8:1111:2::1/64
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

end
copy running-config startup-config
