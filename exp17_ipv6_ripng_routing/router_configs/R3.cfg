! ==============================================================================
! EXPERIMENT 17: IPV6 RIPng - ROUTER R3 CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R3

ipv6 unicast-routing

ipv6 router rip CISCO_RIP
exit

interface GigabitEthernet0/0
 description Link from Router R1
 ipv6 address 2001:DB8:1111:5::3/64
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

interface GigabitEthernet0/1
 description LAN Subnet 3 (Host-C)
 ipv6 address 2001:DB8:1111:3::1/64
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

end
copy running-config startup-config
