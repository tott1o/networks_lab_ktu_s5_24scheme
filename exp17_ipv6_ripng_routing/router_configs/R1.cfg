! ==============================================================================
! EXPERIMENT 17: IPV6 RIPng - ROUTER R1 CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R1

! Enable IPv6 Routing Globally
ipv6 unicast-routing

! Define RIPng Routing Process
ipv6 router rip CISCO_RIP
exit

! Subnet 1 LAN Interface
interface GigabitEthernet0/0
 description LAN Subnet 1 (Host-A)
 ipv6 address 2001:DB8:1111:1::1/64
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

! Subnet 4 WAN Interface to R2 (DCE)
interface Serial0/0/0
 description WAN to Router R2
 ipv6 address 2001:DB8:1111:4::1/64
 clock rate 64000
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

! Subnet 5 Link to R3
interface GigabitEthernet0/1
 description Link to Router R3
 ipv6 address 2001:DB8:1111:5::1/64
 ipv6 rip CISCO_RIP enable
 no shutdown
exit

end
copy running-config startup-config
