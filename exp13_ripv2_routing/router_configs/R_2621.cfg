! ==============================================================================
! EXPERIMENT 13: RIPv2 ROUTING - ROUTER 2621 (R1) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2621

interface GigabitEthernet0/0
 description LAN Interface (Subnet 172.16.10.0/24)
 ip address 172.16.10.1 255.255.255.0
 no shutdown
exit

router rip
 version 2
 no auto-summary
 network 172.16.0.0
exit

end
copy running-config startup-config
