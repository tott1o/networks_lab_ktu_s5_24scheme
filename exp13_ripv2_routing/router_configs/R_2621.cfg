! ==============================================================================
! EXPERIMENT 13: RIPv2 ROUTING - ROUTER 2621 CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R_2621

interface FastEthernet0/0
 ip address 172.16.10.1 255.255.255.0
 no shutdown
exit

router rip
 version 2
 no auto-summary
 network 172.16.0.0
exit

end
copy running-config startup-config
