! ==============================================================================
! EXPERIMENT 13: RIPv2 ROUTING - ROUTER 2501A CONFIGURATION
! ==============================================================================
enable
configure terminal
hostname R_2501A

interface FastEthernet0/0
 ip address 172.16.10.2 255.255.255.0
 no shutdown
exit

interface Serial0/0/0
 ip address 172.16.20.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

router rip
 version 2
 no auto-summary
 network 172.16.0.0
exit

end
copy running-config startup-config
