! ==============================================================================
! EXPERIMENT 13: RIPv2 ROUTING - ROUTER 2501A (R2) CONFIGURATION
! Target Hardware: Cisco 1941 / 2911 + HWIC-2T in Cisco Packet Tracer
! ==============================================================================
enable
configure terminal
hostname R_2501A

interface GigabitEthernet0/0
 description Link to LAN 1 (Router 2621)
 ip address 172.16.10.2 255.255.255.0
 no shutdown
exit

interface Serial0/0/0
 description WAN Link to Router 2501B
 ip address 172.16.20.1 255.255.255.0
 clock rate 64000
 no shutdown
exit

router rip
 version 2
 no auto-summary
 network 172.16.0.0
exit

end
copy running-config startup-config
